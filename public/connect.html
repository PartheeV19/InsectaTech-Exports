<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect With InsectaTech Exports</title>
    <meta
      name="description"
      content="Quick access to chat with InsectaTech Exports on WhatsApp or visit our website."
    />
    <style>
      :root {
        --bg: #fafaf7;
        --card: rgba(255, 255, 255, 0.92);
        --text: #1a1a1a;
        --muted: #5a5a5a;
        --accent: #1b4332;
        --accent-hover: #245c42;
        --border: rgba(27, 67, 50, 0.12);
        --shadow: 0 24px 60px rgba(26, 26, 26, 0.12);
        --whatsapp: #25d366;
        --whatsapp-hover: #20ba5a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(216, 243, 220, 0.95), transparent 35%),
          radial-gradient(circle at bottom right, rgba(184, 134, 11, 0.12), transparent 30%),
          linear-gradient(180deg, #f6f3ee 0%, var(--bg) 100%);
      }

      .shell {
        width: 100%;
        max-width: 540px;
        padding: 40px 28px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 18px auto 0;
        max-width: 32ch;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        margin-top: 32px;
        display: grid;
        gap: 14px;
      }

      .action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 18px 20px;
        border-radius: 18px;
        font-size: 0.98rem;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .action:hover {
        transform: translateY(-2px);
      }

      .action svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .action-whatsapp {
        color: #fff;
        background: var(--whatsapp);
        box-shadow: 0 14px 30px rgba(37, 211, 102, 0.24);
      }

      .action-whatsapp:hover {
        background: var(--whatsapp-hover);
      }

      .action-website {
        color: var(--accent);
        background: #fff;
        border: 1px solid var(--border);
      }

      .action-website:hover {
        border-color: rgba(27, 67, 50, 0.24);
        box-shadow: 0 16px 36px rgba(27, 67, 50, 0.08);
      }

      .footer-note {
        margin-top: 22px;
        font-size: 0.82rem;
        color: #7b7b7b;
      }

      @media (max-width: 480px) {
        .shell {
          padding: 32px 20px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">InsectaTech Exports</p>
      <h1>Choose how you want to connect.</h1>
      <p>
        Chat with our team on WhatsApp or visit our website to explore more about
        InsectaTech Exports.
      </p>

      <div class="actions">
        <a
          class="action action-whatsapp"
          href="https://wa.me/917396600115?text=Hello%20InsectaTech%20Exports%2C%20I%20scanned%20your%20product%20QR%20code."
          target="_blank"
          rel="noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.35-1.66a11.82 11.82 0 0 0 5.71 1.46h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.18-3.45-8.42ZM12.07 21.8h-.01a9.8 9.8 0 0 1-4.98-1.36l-.36-.21-3.77.99 1.01-3.67-.24-.38a9.83 9.83 0 0 1-1.5-5.26c0-5.42 4.42-9.84 9.86-9.84 2.63 0 5.1 1.02 6.96 2.89a9.79 9.79 0 0 1 2.88 6.96c0 5.44-4.42 9.87-9.85 9.87Zm5.4-7.37c-.3-.15-1.79-.88-2.07-.98-.28-.1-.48-.15-.69.15-.2.3-.79.98-.96 1.18-.18.2-.35.23-.65.08-.3-.15-1.27-.47-2.42-1.5a8.98 8.98 0 0 1-1.67-2.07c-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.69-1.67-.95-2.29-.25-.59-.5-.51-.69-.52h-.58c-.2 0-.53.08-.8.38-.28.3-1.05 1.03-1.05 2.52 0 1.48 1.08 2.92 1.23 3.12.15.2 2.11 3.22 5.1 4.52.71.31 1.27.5 1.71.64.72.23 1.38.2 1.9.12.58-.09 1.79-.73 2.04-1.43.25-.7.25-1.3.18-1.43-.08-.13-.28-.2-.58-.35Z"
            />
          </svg>
          Chat With Us
        </a>

        <a
          class="action action-website"
          href="https://insectatechexports.com/"
          target="_blank"
          rel="noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"></path>
          </svg>
          Visit Us
        </a>
      </div>

      <div class="footer-note">insectatechexports.com</div>
    </main>
  </body>
</html>
